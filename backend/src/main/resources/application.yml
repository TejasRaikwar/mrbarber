    password: ${DB_PASSWORD:HCYB1lQRtvkWf6h7}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # TiDB Cloud Serverless's proxy drops idle connections well before HikariCP's
      # own defaults would recycle them; retiring pooled connections proactively
      # avoids requests silently eating a "failed to validate, reconnecting" retry.
      max-lifetime: 180000
      connection-timeout: 20000
      validation-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    open-in-view: false
  servlet:
